    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --input-dark: #0f172a;
            --accent-red: #e11d48;
            --gold-color: #fbbf24;
            --success-color: #10b981;
        }

        body {
            font-family: 'Mukta', 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-container {
            background-color: var(--card-dark);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            gap: 30px;
            max-width: 950px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Form Styling */
        .form-section {
            flex: 1;
            min-width: 300px;
        }

        .form-title {
            color: #f8fafc;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--accent-red);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .language-switcher {
            margin-bottom: 16px;
            padding: 8px 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.55);
        }

        label {
            display: block;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--input-dark);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-family: 'Mukta', sans-serif;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-red);
        }

        .btn-download, .btn-whatsapp {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Mukta', sans-serif;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-download {
            background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.4);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
        }

        .btn-download:hover, .btn-whatsapp:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        /* Poster Preview Styling */
        .poster-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
        }

        #poster-card {
            width: 100%;
            max-width: 380px;
            height: 550px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Themes */
        .theme-red { background: linear-gradient(180deg, #b91c1c 0%, #881337 100%); }
        .theme-blue { background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%); }
        .theme-green { background: linear-gradient(180deg, #047857 0%, #064e3b 100%); }
        .theme-dark { background: linear-gradient(180deg, #18181b 0%, #09090b 100%); border: 2px solid var(--gold-color); }
        .theme-august15 { background: linear-gradient(180deg, #ff9933 0%, #ffffff 50%, #138808 100%); color: #000000 !important; }

        .poster-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 100%;
        }

        .poster-logo-img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .org-name-header {
            font-size: 17px;
            font-weight: 800;
            color: #fbbf24;
            margin-top: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            line-height: 1.2;
            word-break: break-word;
        }

        .theme-august15 .org-name-header {
            color: #0f172a !important;
            text-shadow: none;
        }

        .poster-brand-text p {
            margin: 2px 0 0 0;
            font-size: 9px;
            color: #f1f5f9;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .theme-august15 .poster-brand-text p { color: #1e293b; }

        .poster-slogan {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            margin: 4px 0 2px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            padding: 0 5px;
            line-height: 1.2;
        }

        .theme-august15 .poster-slogan { color: #000000 !important; text-shadow: none; }

        .poster-subtext {
            font-size: 10px;
            color: #e2e8f0;
            margin-bottom: 4px;
            background: rgba(255,255,255,0.15);
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 600;
            display: inline-block;
        }

        .theme-august15 .poster-subtext { background: rgba(0,0,0,0.15); color: #0f172a; }

        .photo-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--gold-color);
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            margin: 2px 0;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-details {
            margin-top: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .user-badge {
            font-size: 11px;
            color: #fef08a;
            font-weight: 700;
            margin-bottom: 2px;
            background: rgba(251, 191, 36, 0.2);
            padding: 2px 10px;
            border-radius: 8px;
            display: inline-block;
        }

        .theme-august15 .user-badge { color: #ffffff; background: #0f172a; }

        .blood-group-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #ffffff;
            padding: 3px 12px;
            border-radius: 20px;
            margin-top: 4px;
            border: 1.5px solid #dc2626;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .blood-group-badge span {
            color: #dc2626 !important;
            font-size: 13px !important;
            font-weight: 800 !important;
        }

        .user-name {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            margin: 2px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            line-height: 1.2;
        }

        .theme-august15 .user-name { color: #0f172a; text-shadow: none; }

        .user-phone {
            font-size: 12px;
            color: #ffffff;
            margin-top: 2px;
            font-weight: 600;
        }

        .theme-august15 .user-phone { color: #0f172a; }

        .poster-footer {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            padding: 6px 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .footer-text p { margin: 0; font-size: 10px; font-weight: 700; color: #1e293b; }
        .footer-text span { font-size: 9px; color: #e11d48; font-weight: 700; }
        .footer-qr img { width: 38px; height: 38px; background: #fff; padding: 2px; border: 1px solid #ddd; border-radius: 4px; }

<body>

    <div class="main-container">
        
        <!-- Form Section -->
        <div class="form-section">
            <div class="form-title">
                <i class="fa-solid fa-layer-group" style="color: var(--accent-red);"></i>
                <span data-i18n="formTitle">माहिती व पोस्टर सन्मान प्रकार</span>
            </div>
            
            <div class="language-switcher">
                <label for="languageSelect" data-i18n="languageLabel">🌐 भाषा / Language</label>
                <select id="languageSelect" onchange="changeLanguage(this.value)">
                    <option value="mr">🇮🇳 मराठी</option>
                    <option value="hi">🇮🇳 हिंदी</option>
                    <option value="en">🇬🇧 English</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="typeLabel">पोस्टरचा सन्मान प्रकार निवडा :</label>
                <select id="userTypeSelect" onchange="updatePoster()">
                    <option value="donor" data-i18n="typeDonor">🩸 संस्था संबंधित रक्तदाता</option>
                    <option value="volunteer" data-i18n="typeVolunteer">👤 अधिकृत स्वयंसेवक</option>
                    <option value="organization" data-i18n="typeOrganization">🤝 फक्त संस्था / संघटना</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="orgNameLabel">संस्थेचे नाव (Organization Name) :</label>
                <input type="text" id="inputOrgName" value="जय हिंद गणेश मंडळ / RAKTDATA" placeholder="संस्थेचे नाव टाका" oninput="updatePoster()">
            </div>

            <div class="form-group" id="groupPersonName">
                <label data-i18n="nameLabel">रक्तदात्याचे / व्यक्तीचे नाव :</label>
                <input type="text" id="inputName" value="अमोल पाटील" placeholder="नाव टाका" oninput="updatePoster()">
            </div>

            <div class="form-group" id="groupBloodGroup">
                <label data-i18n="bloodGroupLabel">🩸 रक्तगट (Blood Group) :</label>
                <select id="inputBloodGroup" onchange="updatePoster()">
                    <option value="A+">A +ve</option>
                    <option value="A-">A -ve</option>
                    <option value="B+" selected>B +ve</option>
                    <option value="B-">B -ve</option>
                    <option value="O+">O +ve</option>
                    <option value="O-">O -ve</option>
                    <option value="AB+">AB +ve</option>
                    <option value="AB-">AB -ve</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="themeLabel">पोस्टरची डिझाईन थीम निवडा :</label>
                <select id="themeSelect" onchange="updatePoster()">
                    <option value="theme-red" data-i18n="themeRed">🔴 ब्राईट रेड (आपत्कालीन मदत)</option>
                    <option value="theme-august15" data-i18n="themeAugust15">🇮🇳 १५ ऑगस्ट - स्वातंत्र्य दिन विशेष</option>
                    <option value="theme-blue" data-i18n="themeBlue">💙 रॉयल् ब्लू (रक्तदान हेच श्रेष्ठ दान)</option>
                    <option value="theme-green" data-i18n="themeGreen">🟢 एमराल्ड ग्रीन (१ युनिट रक्त = ३ जीवन)</option>
                    <option value="theme-dark" data-i18n="themeDark">🖤 प्रीमियम डार्क (महा-रक्तदान जनजागृती)</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="phoneLabel">संपर्क नंबर (पर्यायी) :</label>
                <input type="text" id="inputPhone" value="+९१ ९८७६५४३२१०" placeholder="मोबाईल नंबर टाका" oninput="updatePoster()">
            </div>

            <div class="form-group" id="groupPhoto">
                <label data-i18n="photoLabel">रक्तदात्याचा / व्यक्तीचा फोटो अपलोड करा :</label>
                <input type="file" id="inputPhoto" accept="image/*" onchange="handlePhoto(event)">
            </div>

            <div class="form-group">
                <label data-i18n="logoLabel">संस्थेचे बोधचिन्ह / लोगो अपलोड करा :</label>
                <input type="file" id="inputLogo" accept="image/*" onchange="handleLogo(event)">
            </div>

            <button class="btn-download" onclick="downloadPoster()">
                <i class="fa-solid fa-download"></i> <span data-i18n="downloadButton">पोस्टर डाऊनलोड करा</span>
            </button>

            <button class="btn-whatsapp" onclick="shareOnWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> <span data-i18n="whatsappButton">WhatsApp वर शेअर करा</span>
            </button>
        </div>

        <!-- Poster Preview Section -->
        <div class="poster-wrapper">
            <div id="poster-card" class="theme-red">
                
                <div class="poster-header">
                    <img id="posterLogo" class="poster-logo-img" src="https://cdn-icons-png.flaticon.com/512/1297/1297136.png" alt="Logo">
                    <div class="org-name-header" id="displayOrgName">जय हिंद गणेश मंडळ</div>
                    <div class="poster-brand-text">
                        <p data-i18n="brandSubtitle">NATIONAL BLOOD DONATION MOVEMENT</p>
                    </div>
                </div>

                <div>
                    <div class="poster-slogan" id="displaySlogan">"आपत्कालीन मदतीसाठी तत्पर!"</div>
                    <div class="poster-subtext" id="displaySubtext">रक्तदान करून वाचवले जीवन!</div>
                </div>

                <div class="photo-container" id="displayPhotoContainer">
                    <img id="posterPhoto" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="User Photo">
                </div>

                <div class="user-details">
                    <div class="user-badge" id="displayBadge">🩸 सन्माननीय रक्तदाता 🩸</div>
                    <div class="user-name" id="displayName">अमोल पाटील</div>
                    
                    <div class="blood-group-badge" id="displayBloodGroupWrapper">
                        <i class="fa-solid fa-droplet" style="color:#dc2626;"></i> 
                        <span id="displayBloodGroup">B+</span>
                    </div>

                    <div class="user-phone" id="displayPhoneWrapper"><i class="fa-solid fa-phone" style="font-size:10px; color:var(--gold-color);"></i> <span id="displayPhone">+९१ ९८७६५४३२१०</span></div>
                </div>

                <div class="poster-footer">
                    <div class="footer-text">
                        <p data-i18n="footerVisit">रक्तदानासाठी आजच भेट द्या:</p>
                        <span>www.raktdata.in</span>
                    </div>
                    <div class="footer-qr">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.raktdata.in" alt="QR Code">
                    </div>
                </div>

            </div>
        </div>

    </div>

                logoLabel: "Upload Organization Logo:",
                downloadButton: "Download Poster", whatsappButton: "Share on WhatsApp",
                brandSubtitle: "NATIONAL BLOOD DONATION MOVEMENT", footerVisit: "Visit today to donate blood:",
                defaultOrg: "Organization Name", defaultName: "Donor Name", downloadDone: "Poster downloaded successfully!",
                shareMessage: "I have joined the RAKTDATA.IN National Blood Donation Movement! You can join today too: www.raktdata.in"
            }
        };

        const themeSlogans = {

                'theme-red': '"आपत्कालीन मदतीसाठी तत्पर!"',
                'theme-august15': '"स्वातंत्र्याचा अमृत महोत्सव - रक्तदान हेच देशसेवा!"',
                'theme-blue': '"रक्तदान हेच श्रेष्ठ दान, वाचवा कोणाचेही प्राण!"',

            },
            hi: {
                'theme-red': '"आपातकालीन सहायता के लिए तत्पर!"',
                'theme-august15': '"स्वतंत्रता का अमृत महोत्सव - रक्तदान ही देशसेवा!"',
                'theme-blue': '"रक्तदान ही श्रेष्ठ दान, किसी की जान बचाएँ!"',
                'theme-green': '"१ यूनिट रक्त ३ लोगों का जीवन बचा सकता है!"',

            en: {
                'theme-red': '"Always Ready for Emergency Support!"',
                'theme-august15': '"Freedom Celebration - Blood Donation is Nation Service!"',

                'theme-green': '"1 Unit of Blood Can Save 3 Lives!"',
                'theme-dark': '"Come Together and Grow the Blood Donation Movement!"'
            }
        };

        const userTypeSettings = {
            mr: {
                volunteer: { badge: '★ अधिकृत स्वयंसेवक ★', subtext: 'सदैव सेवेत - RaktData स्वयंसेवक' },
                donor: { badge: '🩸 सन्माननीय रक्तदाता 🩸', subtext: 'रक्तदान करून वाचवले जीवन!' },
                organization: { badge: '🤝 सहयोगी संस्था 🤝', subtext: 'आमचा आधार - मोहिमेत सहभागी संस्था' }
            },
            hi: {
                volunteer: { badge: '★ अधिकृत स्वयंसेवक ★', subtext: 'सदैव सेवा में - RaktData स्वयंसेवक' },
                donor: { badge: '🩸 सम्माननीय रक्तदाता 🩸', subtext: 'रक्तदान करके जीवन बचाया!' },
                organization: { badge: '🤝 सहयोगी संस्था 🤝', subtext: 'हमारा सहयोग - अभियान में सहभागी संस्था' }
            },
            en: {
                volunteer: { badge: '★ Authorized Volunteer ★', subtext: 'Always in Service - RaktData Volunteer' },
                donor: { badge: '🩸 Honored Blood Donor 🩸', subtext: 'Saved a Life by Donating Blood!' },
                organization: { badge: '🤝 Partner Organization 🤝', subtext: 'Our Support - Participating Organization' }
            }
        };

        let currentLanguage = localStorage.getItem('raktdataLanguage') || 'mr';

        function changeLanguage(lang) {
            currentLanguage = translations[lang] ? lang : 'mr';
            localStorage.setItem('raktdataLanguage', currentLanguage);
            document.documentElement.lang = currentLanguage;
            const t = translations[currentLanguage];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            document.getElementById('languageSelect').value = currentLanguage;
            updatePoster();
        }

        function updatePoster() {
            const t = translations[currentLanguage];
            const selectedType = document.getElementById('userTypeSelect').value;

            // Update Org & Person Name
            document.getElementById('displayOrgName').innerText = document.getElementById('inputOrgName').value || t.defaultOrg;
            document.getElementById('displayName').innerText = document.getElementById('inputName').value || t.defaultName;
            
            // Phone Number
            const phone = document.getElementById('inputPhone').value;
            if(phone) {
                document.getElementById('displayPhoneWrapper').style.display = 'block';
                document.getElementById('displayPhone').innerText = phone;
            } else {
                document.getElementById('displayPhoneWrapper').style.display = 'none';
            }

            // Blood Group
            const bloodGroupSelect = document.getElementById('inputBloodGroup');
            const selectedBloodGroup = bloodGroupSelect.options[bloodGroupSelect.selectedIndex].text;
            document.getElementById('displayBloodGroupWrapper').innerHTML = 
                `<i class="fa-solid fa-droplet" style="color:#dc2626;"></i> <span>${selectedBloodGroup}</span>`;

            // Theme & Slogan
            const selectedTheme = document.getElementById('themeSelect').value;
            document.getElementById('poster-card').className = selectedTheme;
            document.getElementById('displaySlogan').innerText = themeSlogans[currentLanguage][selectedTheme];

            // Badge & Subtext
            const settings = userTypeSettings[currentLanguage][selectedType];
            document.getElementById('displayBadge').innerText = settings.badge;
            document.getElementById('displaySubtext').innerText = settings.subtext;

            // Conditional visibility for "Organization Only"
            if (selectedType === 'organization') {
                document.getElementById('groupPersonName').style.display = 'none';
                document.getElementById('groupBloodGroup').style.display = 'none';
                document.getElementById('groupPhoto').style.display = 'none';
                document.getElementById('displayPhotoContainer').style.display = 'none';
                document.getElementById('displayBloodGroupWrapper').style.display = 'none';
                document.getElementById('displayName').style.display = 'none';
            } else {
                document.getElementById('groupPersonName').style.display = 'block';
                document.getElementById('groupBloodGroup').style.display = 'block';
                document.getElementById('groupPhoto').style.display = 'block';
                document.getElementById('displayPhotoContainer').style.display = 'block';
                document.getElementById('displayBloodGroupWrapper').style.display = 'inline-flex';
                document.getElementById('displayName').style.display = 'block';
            }
        }

        function handlePhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('posterPhoto').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function handleLogo(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('posterLogo').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function downloadPoster() {
            const poster = document.getElementById('poster-card');
            const userName = document.getElementById('inputName').value || 'Donor';

            html2canvas(poster, {
                scale: 3,
                useCORS: true,
                allowTaint: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `RaktData_Poster_${userName}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function shareOnWhatsApp() {
            var message = encodeURIComponent(translations[currentLanguage].shareMessage);
            var whatsappUrl = `https://api.whatsapp.com/send?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }

        // Initialize Poster
        updatePoster();
    </script>
</body>
</html>
