<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रक्तदाता व संस्था सन्मान पोस्टर मेकर | RaktData.in</title>
    
    <!-- Google Devanagari Font (Mukta) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Html2Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --input-dark: #0f172a;
            --accent-red: #e11d48;
            --gold-color: #fbbf24;
        }

        body {
            font-family: 'Mukta', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-container {
            background-color: var(--card-dark);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            gap: 30px;
            max-width: 950px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            justify-content: center;
        }

        .form-section { flex: 1; min-width: 300px; }
        .form-title {
            color: #f8fafc;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--accent-red);
            padding-bottom: 10px;
        }

        .form-group { margin-bottom: 14px; }

        label {
            display: block;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--input-dark);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-family: 'Mukta', sans-serif;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--accent-red); }

        .btn-download, .btn-whatsapp {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Mukta', sans-serif;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-download { background: linear-gradient(135deg, #e11d48 0%, #be123c 100%); }
        .btn-whatsapp { background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); }

        /* Poster Preview */
        .poster-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
        }

        #poster-card {
            width: 100%;
            max-width: 380px;
            height: 540px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Themes */
        .theme-red { background: linear-gradient(180deg, #b91c1c 0%, #881337 100%); }
        .theme-blue { background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%); }
        .theme-green { background: linear-gradient(180deg, #047857 0%, #064e3b 100%); }
        .theme-dark { background: linear-gradient(180deg, #18181b 0%, #09090b 100%); border: 2px solid var(--gold-color); }
        .theme-august15 { background: linear-gradient(180deg, #ff9933 0%, #ffffff 50%, #138808 100%); color: #000000 !important; }

        .poster-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 100%;
        }

        .poster-logo-img {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }

        .brand-header {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            margin-top: 2px;
            line-height: 1.2;
        }

        .org-name-text {
            font-size: 16px;
            font-weight: 800;
            color: #fbbf24;
            margin-top: 2px;
            line-height: 1.2;
        }

        .theme-august15 .brand-header, 
        .theme-august15 .org-name-text,
        .theme-august15 .user-name { color: #0f172a !important; }

        .poster-slogan {
            font-size: 14px;
            font-weight: 800;
            color: var(--gold-color);
            margin: 4px 0 2px 0;
            padding: 0 5px;
        }

        .theme-august15 .poster-slogan { color: #0f172a !important; }

        .poster-subtext {
            font-size: 10px;
            color: #e2e8f0;
            background: rgba(255,255,255,0.15);
            padding: 2px 10px;
            border-radius: 10px;
            display: inline-block;
        }

        .photo-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--gold-color);
            overflow: hidden;
            background: #ffffff;
            margin: 2px 0;
        }

        .photo-container img { width: 100%; height: 100%; object-fit: cover; }

        .user-details { display: flex; flex-direction: column; align-items: center; }

        .user-badge {
            font-size: 11px;
            color: #fef08a;
            font-weight: 700;
            background: rgba(251, 191, 36, 0.2);
            padding: 2px 10px;
            border-radius: 8px;
        }

        .blood-group-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            padding: 3px 12px;
            border-radius: 20px;
            margin-top: 4px;
            border: 1.5px solid #dc2626;
        }

        .blood-group-badge span { color: #dc2626; font-size: 13px; font-weight: 800; }
        .user-name { font-size: 18px; font-weight: 800; color: #ffffff; margin: 2px 0; }
        .user-phone { font-size: 12px; color: #ffffff; margin-top: 2px; }

        .poster-footer {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            padding: 6px 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .footer-text p { margin: 0; font-size: 10px; font-weight: 700; color: #1e293b; }
        .footer-text span { font-size: 9px; color: #e11d48; font-weight: 700; }
        .footer-qr img { width: 38px; height: 38px; }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="form-section">
            <div class="form-title">
                <i class="fa-solid fa-id-card" style="color: var(--accent-red);"></i>
                <span>रक्तदाता पोस्टर माहिती</span>
            </div>

            <div class="form-group">
                <label>पोस्टरचा प्रकार निवडा :</label>
                <select id="donorCategorySelect" onchange="updateFormFields()">
                    <option value="personal">👤 व्यक्तिगत रक्तदाता (RaktData.in)</option>
                    <option value="organization">🤝 संस्थेशी जोडलेला रक्तदाता</option>
                </select>
            </div>

            <!-- संस्था प्रकार निवडल्यावरच दिसेल -->
            <div class="form-group" id="groupOrgName" style="display: none;">
                <label>संस्थेचे नाव (Organization Name) :</label>
                <input type="text" id="inputOrgName" value="जय हिंद गणेश मंडळ" placeholder="संस्थेचे नाव टाका" oninput="updatePoster()">
            </div>

            <div class="form-group" id="groupOrgLogo" style="display: none;">
                <label>संस्थेचा लोगो अपलोड करा :</label>
                <input type="file" id="inputLogo" accept="image/*" onchange="handleLogo(event)">
            </div>

            <div class="form-group">
                <label>रक्तदात्याचे पूर्ण नाव :</label>
                <input type="text" id="inputName" value="अमोल पाटील" placeholder="नाव टाका" oninput="updatePoster()">
            </div>

            <div class="form-group">
                <label>🩸 रक्तगट (Blood Group) :</label>
                <select id="inputBloodGroup" onchange="updatePoster()">
                    <option value="A+">A +ve</option>
                    <option value="A-">A -ve</option>
                    <option value="B+" selected>B +ve</option>
                    <option value="B-">B -ve</option>
                    <option value="O+">O +ve</option>
                    <option value="O-">O -ve</option>
                    <option value="AB+">AB +ve</option>
                    <option value="AB-">AB -ve</option>
                </select>
            </div>

            <div class="form-group">
                <label>पोस्टर डिझाईन थीम निवडा :</label>
                <select id="themeSelect" onchange="updatePoster()">
                    <option value="theme-red">🔴 ब्राईट रेड (आपत्कालीन मदत)</option>
                    <option value="theme-august15">🇮🇳 १५ ऑगस्ट - स्वातंत्र्य दिन विशेष</option>
                    <option value="theme-blue">💙 रॉयल् ब्लू (रक्तदान हेच श्रेष्ठ दान)</option>
                    <option value="theme-green">🟢 एमराल्ड ग्रीन (१ युनिट रक्त = ३ जीवन)</option>
                    <option value="theme-dark">🖤 प्रीमियम डार्क (महा-रक्तदान जनजागृती)</option>
                </select>
            </div>

            <div class="form-group">
                <label>संपर्क नंबर (पर्यायी) :</label>
                <input type="text" id="inputPhone" value="+९१ ९८७६५४३२१०" placeholder="मोबाईल नंबर टाका" oninput="updatePoster()">
            </div>

            <div class="form-group">
                <label>रक्तदात्याचा फोटो अपलोड करा :</label>
                <input type="file" id="inputPhoto" accept="image/*" onchange="handlePhoto(event)">
            </div>

            <button class="btn-download" onclick="downloadPoster()">
                <i class="fa-solid fa-download"></i> poster डाऊनलोड करा
            </button>

            <button class="btn-whatsapp" onclick="shareOnWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp वर शेअर करा
            </button>
        </div>

        <!-- Poster Preview -->
        <div class="poster-wrapper">
            <div id="poster-card" class="theme-red">
                
                <div class="poster-header">
                    <img id="posterLogo" class="poster-logo-img" src="https://cdn-icons-png.flaticon.com/512/1297/1297136.png" alt="Logo">
                    <div class="brand-header" id="displayBrandHeader">RAKTDATA.IN</div>
                    <div class="org-name-text" id="displayOrgName" style="display: none;"></div>
                </div>

                <div>
                    <div class="poster-slogan" id="displaySlogan">"आपत्कालीन मदतीसाठी तत्पर!"</div>
                    <div class="poster-subtext">रक्तदान करून वाचवले जीवन!</div>
                </div>

                <div class="photo-container">
                    <img id="posterPhoto" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="User Photo">
                </div>

                <div class="user-details">
                    <div class="user-badge">🩸 सन्माननीय रक्तदाता 🩸</div>
                    <div class="user-name" id="displayName">अमोल पाटील</div>
                    
                    <div class="blood-group-badge">
                        <i class="fa-solid fa-droplet" style="color:#dc2626;"></i> 
                        <span id="displayBloodGroup">B+</span>
                    </div>

                    <div class="user-phone" id="displayPhoneWrapper"><i class="fa-solid fa-phone" style="font-size:10px; color:var(--gold-color);"></i> <span id="displayPhone">+९१ ९८७६५४३२१०</span></div>
                </div>

                <div class="poster-footer">
                    <div class="footer-text">
                        <p>रक्तदानासाठी आजच भेट द्या:</p>
                        <span>www.raktdata.in</span>
                    </div>
                    <div class="footer-qr">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.raktdata.in" alt="QR Code">
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        const defaultRaktDataLogo = "https://cdn-icons-png.flaticon.com/512/1297/1297136.png";
        let customOrgLogo = null;

        function updateFormFields() {
            const category = document.getElementById('donorCategorySelect').value;
            const orgNameGroup = document.getElementById('groupOrgName');
            const orgLogoGroup = document.getElementById('groupOrgLogo');
            
            if (category === 'organization') {
                orgNameGroup.style.display = 'block';
                orgLogoGroup.style.display = 'block';
            } else {
                orgNameGroup.style.display = 'none';
                orgLogoGroup.style.display = 'none';
            }
            updatePoster();
        }

        function updatePoster() {
            const category = document.getElementById('donorCategorySelect').value;
            const brandHeader = document.getElementById('displayBrandHeader');
            const orgNameDisplay = document.getElementById('displayOrgName');
            const logoImg = document.getElementById('posterLogo');

            if (category === 'personal') {
                brandHeader.style.display = 'block';
                brandHeader.innerText = "RAKTDATA.IN";
                orgNameDisplay.style.display = 'none';
                logoImg.src = defaultRaktDataLogo;
            } else {
                brandHeader.style.display = 'none';
                orgNameDisplay.style.display = 'block';
                orgNameDisplay.innerText = document.getElementById('inputOrgName').value || "संस्थेचे नाव";
                logoImg.src = customOrgLogo ? customOrgLogo : defaultRaktDataLogo;
            }

            // Name, Phone & Blood Group Update
            document.getElementById('displayName').innerText = document.getElementById('inputName').value || "रक्तदात्याचे नाव";
            const phone = document.getElementById('inputPhone').value;
            if(phone) {
                document.getElementById('displayPhoneWrapper').style.display = 'block';
                document.getElementById('displayPhone').innerText = phone;
            } else {
                document.getElementById('displayPhoneWrapper').style.display = 'none';
            }

            const bloodGroupSelect = document.getElementById('inputBloodGroup');
            document.getElementById('displayBloodGroup').innerText = bloodGroupSelect.options[bloodGroupSelect.selectedIndex].text;

            // Theme update
            const selectedTheme = document.getElementById('themeSelect').value;
            document.getElementById('poster-card').className = selectedTheme;
        }

        function handlePhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { document.getElementById('posterPhoto').src = e.target.result; }
                reader.readAsDataURL(file);
            }
        }

        function handleLogo(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    customOrgLogo = e.target.result;
                    document.getElementById('posterLogo').src = customOrgLogo;
                }
                reader.readAsDataURL(file);
            }
        }

        function downloadPoster() {
            const poster = document.getElementById('poster-card');
            const name = document.getElementById('inputName').value || 'Donor';

            html2canvas(poster, { scale: 3, useCORS: true, allowTaint: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Blood_Donor_Poster_${name}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function shareOnWhatsApp() {
            var message = encodeURIComponent("मी RAKTDATA.IN च्या रक्तदान मोहिमेत सहभागी झालो आहे! आपणही जोडले जा: www.raktdata.in");
            window.open(`https://api.whatsapp.com/send?text=${message}`, '_blank');
        }

        updateFormFields();
    </script>
</body>
</html>
