        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --input-dark: #0f172a;
            --accent-red: #e11d48;
            --gold-color: #fbbf24;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-container {
            background-color: var(--card-dark);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            gap: 40px;
            max-width: 950px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Form Styling */
        .form-section {
            flex: 1;
            min-width: 320px;
        }

        .form-title {
            color: #f8fafc;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--accent-red);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .language-switcher {
            margin-bottom: 18px;
            padding: 10px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.55);
        }

        .language-switcher label {
            margin-bottom: 6px;
        }

        .language-switcher select {
            border-color: var(--accent-red);
        }

        label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--input-dark);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-red);
        }

        .btn-download {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-download:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-whatsapp {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-whatsapp:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Poster Preview Styling */
        .poster-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #poster-card {
            width: 380px;
            height: 520px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            transition: all 0.4s ease;
        }

        /* Poster Themes */
        .theme-red { background: linear-gradient(180deg, #b91c1c 0%, #881337 100%); }
        .theme-blue { background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%); }
        .theme-green { background: linear-gradient(180deg, #047857 0%, #064e3b 100%); }
        .theme-dark { background: linear-gradient(180deg, #18181b 0%, #09090b 100%); border: 2px solid var(--gold-color); }
        .theme-august15 { background: linear-gradient(180deg, #ff9933 0%, #ffffff 50%, #138808 100%); color: #000000 !important; }

        .poster-header {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .poster-logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .poster-brand-text h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            line-height: 1;
        }

        .poster-brand-text p {
            margin: 3px 0 0 0;
            font-size: 7.5px;
            color: #f1f5f9;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* 15th August theme text override */
        .theme-august15 .poster-brand-text h2, 
        .theme-august15 .poster-brand-text p,
        .theme-august15 .user-name,
        .theme-august15 .user-phone {
            color: #0f172a !important;
            text-shadow: none;
        }

        .poster-slogan {
            font-size: 14px;
            font-weight: 800;
            color: var(--gold-color);
            margin: 6px 0 2px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            padding: 0 10px;
        }

        .theme-august15 .poster-slogan {
            color: #0f172a !important;
            text-shadow: none;
        }

        .poster-subtext {
            font-size: 9.5px;
            color: #e2e8f0;
            margin-bottom: 5px;
            background: rgba(255,255,255,0.15);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            display: inline-block;
        }

        .theme-august15 .poster-subtext {
            background: rgba(0,0,0,0.15);
            color: #0f172a;
        }

        .photo-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--gold-color);
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            margin: 2px 0;
        }

        .theme-august15 .photo-container {
            border-color: #000066;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-details {
            margin-top: 2px;
        }

        .user-badge {
            font-size: 10.5px;
            color: #fef08a;
            font-weight: 700;
            margin-bottom: 2px;
            background: rgba(251, 191, 36, 0.15);
            padding: 1px 6px;
            border-radius: 8px;
            display: inline-block;
        }

        .theme-august15 .user-badge {
            color: #ffffff;
            background: #0f172a;
        }

        .user-name {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            line-height: 1.2;
        }

        .user-phone {
            font-size: 11px;
            color: #ffffff;
            margin-top: 2px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        /* Poster Footer with QR Code Integration */
        .poster-footer {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            padding: 6px 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        .footer-text {
            text-align: left;
        }

        .footer-text p {
            margin: 0;
            font-size: 9px;
            font-weight: bold;
            color: #1e293b;
        }

        .footer-text span {
            font-size: 8px;
            color: #e11d48;
            font-weight: 700;
        }

            width: 40px;
            height: 40px;
            background: #fff;
            padding: 2px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

    <div class="main-container">
        
        <!-- Form Section -->
        <div class="form-section">
            <div class="form-title">
                <i class="fa-solid fa-people-arrows" style="color: var(--accent-red);"></i>
                <span data-i18n="formTitle">माहिती व पोस्टर सन्मान प्रकार</span>
            </div>
            <div class="language-switcher">
                <label for="languageSelect" data-i18n="languageLabel">🌐 भाषा / Language</label>
                <select id="languageSelect" onchange="changeLanguage(this.value)">
                    <option value="mr">🇮🇳 मराठी</option>
                    <option value="hi">🇮🇳 हिंदी</option>
                    <option value="en">🇬🇧 English</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="typeLabel">पोस्टरचा सन्मान प्रकार निवडा :</label>
                <select id="userTypeSelect" onchange="updatePoster()">
                    <option value="volunteer" data-i18n="typeVolunteer">👤 अधिकृत स्वयंसेवक</option>
                    <option value="donor" data-i18n="typeDonor">🩸 सन्माननीय रक्तदाता</option>
                    <option value="organization" data-i18n="typeOrganization">🤝 सहयोगी संस्था / संघटना</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="themeLabel">पोस्टरची डिझाईन थीम निवडा :</label>
                <select id="themeSelect" onchange="updatePoster()">
                    <option value="theme-red" data-i18n="themeRed">🔴 ब्राईट रेड (आपत्कालीन मदत)</option>
                    <option value="theme-august15" data-i18n="themeAugust15">🇮🇳 १५ ऑगस्ट - स्वातंत्र्य दिन विशेष</option>
                    <option value="theme-blue" data-i18n="themeBlue">💙 रॉयल् ब्लू (रक्तदान हेच श्रेष्ठ दान)</option>
                    <option value="theme-green" data-i18n="themeGreen">🟢 एमराल्ड ग्रीन (१ युनिट रक्त = ३ जीवन)</option>
                    <option value="theme-dark" data-i18n="themeDark">🖤 प्रीमियम डार्क (महा-रक्तदान जनजागृती)</option>
                </select>
            </div>

            <div class="form-group">
                <label id="labelName" data-i18n="nameLabel">व्यक्तीचे / संस्थेचे पूर्ण नाव :</label>
                <input type="text" id="inputName" value="अमोल पाटील" placeholder="नाव टाका" data-i18n-placeholder="namePlaceholder" oninput="updatePoster()">
            </div>

            <div class="form-group">
                <label data-i18n="phoneLabel">संपर्क नंबर (पर्यायी) :</label>
                <input type="text" id="inputPhone" value="+९१ ९८७६५४३२१०" placeholder="मोबाईल नंबर टाका" data-i18n-placeholder="phonePlaceholder" oninput="updatePoster()">
            </div>

            <div class="form-group">
                <label data-i18n="photoLabel">संबंधित फोटो अपलोड करा (फक्त व्यक्तीसाठी) :</label>
                <input type="file" id="inputPhoto" accept="image/*" onchange="handlePhoto(event)">
            </div>

            <div class="form-group">
                <label data-i18n="logoLabel">संस्थेचा / स्वतःचा लोगो अपलोड करा (फक्त संस्थेसाठी) :</label>
                <input type="file" id="inputLogo" accept="image/*" onchange="handleLogo(event)">
            </div>

            <button class="btn-download" onclick="downloadPoster()">
                <i class="fa-solid fa-download"></i> <span data-i18n="downloadButton">पोस्टर डाऊनलोड करा</span>
            </button>

            <button class="btn-whatsapp" onclick="shareOnWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> <span data-i18n="whatsappButton">WhatsApp वर शेअर करा</span>
            </button>
        </div>

        <!-- Poster Preview Section -->
        <div class="poster-wrapper">
            <div id="poster-card" class="theme-red">
                
                <!-- Poster Header (Logo + Brand) -->
                <div class="poster-header">
                    <img id="posterLogo" class="poster-logo-img" src="logo.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1297/1297136.png'">
                    <div class="poster-brand-text">
                        <h2>RAKTDATA.IN</h2>
                        <p data-i18n="brandSubtitle">NATIONAL BLOOD DONATION MOVEMENT</p>
                    </div>
                </div>

                <!-- Slogan Area -->
                <div>
                    <div class="poster-slogan" id="displaySlogan">"आपत्कालीन मदतीसाठी तत्पर!"</div>
                    <div class="poster-subtext" id="displaySubtext">सदैव सेवेत - RaktData स्वयंसेवक</div>
                </div>

                <!-- User Photo -->
                <div class="photo-container">
                    <img id="posterPhoto" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="User Photo">
                </div>

                <!-- User Details -->
                <div class="user-details">
                    <div class="user-badge" id="displayBadge">★ अधिकृत स्वयंसेवक ★</div>
                    <div class="user-name" id="displayName">अमोल पाटील</div>
                    <div class="user-phone"><i class="fa-solid fa-phone" style="font-size:10px; color:var(--gold-color);"></i> <span id="displayPhone">+९१ ९८७६५४३२१०</span></div>
                </div>

                <!-- Poster Footer with QR Code -->
                <div class="poster-footer">
                    <div class="footer-text">
                        <p data-i18n="footerVisit">रक्तदानासाठी आजच भेट द्या:</p>
                        <span>www.raktdata.in</span>
                    </div>
                    <div class="footer-qr">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.raktdata.in" alt="QR Code">
                    </div>
                </div>

            </div>
        </div>

    </div>

                organization: { badge: '🤝 सहयोगी संस्था 🤝', subtext: 'आमचा आधार - मोहिमेत सहभागी संस्था', defaultPhoto: 'https://cdn-icons-png.flaticon.com/512/1297/1297136.png' }

        let currentLanguage = localStorage.getItem('raktdataLanguage') || 'mr';

        function changeLanguage(lang) {
            currentLanguage = translations[lang] ? lang : 'mr';
            localStorage.setItem('raktdataLanguage', currentLanguage);
            document.documentElement.lang = currentLanguage;
            const t = translations[currentLanguage];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });

            document.getElementById('languageSelect').value = currentLanguage;
            updatePoster();
        }

        function updatePoster() {
            const t = translations[currentLanguage];
            document.getElementById('displayName').innerText =
                document.getElementById('inputName').value || t.defaultName;
            document.getElementById('displayPhone').innerText =
                document.getElementById('inputPhone').value || "";

            const selectedTheme = document.getElementById('themeSelect').value;
            document.getElementById('poster-card').className = selectedTheme;
            document.getElementById('displaySlogan').innerText =
                themeSlogans[currentLanguage][selectedTheme];

            const selectedType = document.getElementById('userTypeSelect').value;
            const settings = userTypeSettings[currentLanguage][selectedType];
            document.getElementById('displayBadge').innerText = settings.badge;
            document.getElementById('displaySubtext').innerText = settings.subtext;

            const photoEl = document.getElementById('posterPhoto');
            if (photoEl.src.includes('cdn-icons-png')) {
                photoEl.src = settings.defaultPhoto;
            }
        }

        function handlePhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('posterPhoto').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function handleLogo(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('posterLogo').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function downloadPoster() {
            const poster = document.getElementById('poster-card');
            const userName = document.getElementById('inputName').value || 'Honored';

            html2canvas(poster, {
                scale: 3,
                useCORS: true,
                allowTaint: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `RaktData_HonoredPoster_${userName}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                alert(translations[currentLanguage].downloadDone);
            });
        }

        function shareOnWhatsApp() {
            var message = encodeURIComponent(translations[currentLanguage].shareMessage);
            var whatsappUrl = `https://api.whatsapp.com/send?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
