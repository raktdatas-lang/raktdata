<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रक्तदाता - मानवतेचा संदेश (E-Book)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #1a1a1a; color: #ffffff; font-family: Arial, sans-serif; text-align: center; }
        .header { background-color: #111; padding: 15px; border-bottom: 2px solid #e63946; }
        .header h2 { font-size: 20px; color: #fff; }
        .reader-container { width: 100%; height: 88vh; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>

<!-- राइट क्लिक (Right-click) आणि मजकूर सिलेक्ट करणे बंद करण्यासाठी -->
<body oncontextmenu="return false;">

    <div class="header">
        <h2>रक्तदाता - मानवतेचा संदेश (लेखक: डॉ. एम. गायकवाड)</h2>
    </div>

    <!-- Google Doc Viewer मधे तुमची Raw PDF लिंक (Download Button लपवलेले) -->
    <div class="reader-container">
        <iframe src="https://docs.google.com/gview?url=https://raw.githubusercontent.com/raktdatas-lang/raktdata/main/raktdata-ebook.pdf&embedded=true"></iframe>
    </div>

</body>
</html>
